<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seminary Directory</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500;600&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0a1f3d;--sf:rgba(255,255,255,.13);--tx:#F4F9FF;--mu:rgba(236,246,255,.74);--ln:rgba(255,255,255,.3);--pr:#92FE9D;--prt:#0a1f3d;--ac:#7FE9FF;--er:#FFC2C2;--av:rgba(255,255,255,.14);--blur:blur(20px) saturate(150%);--shadow:0 8px 32px rgba(3,12,30,.35),inset 0 1px 0 rgba(255,255,255,.35);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}


html,body{margin:0}
body{min-height:100vh;color:var(--tx);font:16px/1.5 Figtree,system-ui,sans-serif;background-color:#0a1f3d;background-image:linear-gradient(135deg,rgba(10,31,61,0.95) 0%,rgba(10,31,61,0.4) 50%,#92FE9D00 100%),linear-gradient(135deg,#00C9FF00 0%,#00C9FF99 50%,#92FE9D 100%);background-attachment:fixed;background-repeat:no-repeat;background-size:cover}
h1,h2,h3{font-family:Newsreader,Georgia,serif;font-weight:600;margin:0;line-height:1.2}
main{max-width:760px;margin:0 auto;padding:20px 16px 96px}
h1{font-size:1.9rem}
.sub{color:var(--mu);margin:6px 0 20px;max-width:46ch}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.hero{padding:28px 0 8px}
.hero h1{font-size:2.4rem;max-width:12ch}
.stats{display:grid;gap:10px;margin-top:20px}
.stat{display:flex;justify-content:space-between;align-items:center;background:var(--sf);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--ln);box-shadow:var(--shadow);border-radius:20px;padding:18px 20px;width:100%;color:var(--tx);text-align:left}
.stat b{font:600 1.7rem Newsreader,serif;color:var(--pr)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.card{background:var(--sf);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--ln);box-shadow:var(--shadow);border-radius:20px;overflow:hidden;padding:8px;text-align:left;color:var(--tx)}.card .ph{border-radius:14px}
.ph{aspect-ratio:1;background:var(--av);display:grid;place-items:center;font:600 2rem Newsreader,serif;color:var(--pr);overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.card .nm{padding:10px 12px 12px;font-weight:600;font-size:.95rem}
.card .nm small{display:block;font-weight:400;color:var(--mu)}
.bar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
.btn{background:var(--pr);color:var(--prt);border:0;border-radius:14px;padding:10px 18px;font-weight:600;box-shadow:0 4px 18px rgba(146,254,157,.35)}
.btn.alt{background:transparent;color:var(--pr);border:1px solid var(--pr)}
.btn.del{background:transparent;color:var(--er);border:1px solid var(--er)}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(10,31,61,.35);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-top:1px solid var(--ln);box-shadow:0 -8px 32px rgba(3,12,30,.3);display:flex;gap:4px;padding:6px 8px env(safe-area-inset-bottom,0px);z-index:20}
nav button{flex:1;background:none;border:0;border-radius:16px;padding:8px 2px;color:var(--mu);font-size:.68rem;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current="page"]{color:var(--pr);font-weight:600;background:rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.ov{position:fixed;inset:0;background:rgba(4,14,32,.45);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);z-index:30;display:flex;align-items:flex-end;justify-content:center;animation:fade .25s ease}
.sheet{background:rgba(255,255,255,.16);-webkit-backdrop-filter:blur(28px) saturate(160%);backdrop-filter:blur(28px) saturate(160%);border:1px solid var(--ln);border-bottom:0;box-shadow:var(--shadow);width:100%;max-width:560px;max-height:90%;overflow:auto;border-radius:28px 28px 0 0;padding:22px 22px calc(26px + env(safe-area-inset-bottom,0px));animation:rise .38s cubic-bezier(.2,.8,.2,1)}
.top{display:flex;gap:16px;align-items:center;margin-bottom:16px}
.top .ph{width:96px;border-radius:12px;flex:none;font-size:2rem}
dl{margin:0;display:grid;gap:12px}
dt{font-size:.85rem;color:var(--mu)}
dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.row{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
label{display:block;font-size:.9rem;color:var(--mu);margin:12px 0 4px}
input,select,textarea{width:100%;box-sizing:border-box;font:inherit;padding:11px 14px;border:1px solid var(--ln);border-radius:14px;background:rgba(255,255,255,.12);color:var(--tx)}input::placeholder{color:var(--mu)}
.seg{display:flex;gap:4px;padding:4px;background:var(--sf);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--ln);border-radius:16px;margin:16px 0}
.seg button{flex:1;border:0;border-radius:12px;background:transparent;color:var(--mu);padding:10px}
.seg button[aria-pressed="true"]{background:var(--pr);color:var(--prt);font-weight:600}
.err{color:var(--er);margin-top:10px;min-height:1.4em}
.note{background:var(--sf);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--ln);border-radius:16px;padding:14px 16px;font-size:.88rem;color:var(--mu);margin-top:20px}
.empty{color:var(--mu);padding:30px 0}
.card,.stat,.btn,nav button,.seg button,input,textarea{transition:transform .25s cubic-bezier(.2,.8,.2,1),background-color .25s,box-shadow .25s,color .25s,border-color .25s}
.card:hover,.stat:hover{transform:translateY(-4px);background:rgba(255,255,255,.22)}
.card:active,.stat:active,.btn:active,nav button:active{transform:scale(.96)}
.btn:hover{box-shadow:0 6px 24px rgba(146,254,157,.55)}
nav button:hover,.seg button:hover{color:var(--tx)}
input:focus,textarea:focus{background:rgba(255,255,255,.2);border-color:var(--ac)}
main>*{animation:rise .45s cubic-bezier(.2,.8,.2,1)}
.grid .card{animation:pop .45s cubic-bezier(.2,.8,.2,1) backwards}
.grid .card:nth-child(2){animation-delay:.05s}.grid .card:nth-child(3){animation-delay:.1s}.grid .card:nth-child(4){animation-delay:.15s}.grid .card:nth-child(n+5){animation-delay:.2s}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
@keyframes pop{from{opacity:0;transform:scale(.92)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.cr{position:relative;margin:22px 0;border-radius:24px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--ln)}
.cr.fx{aspect-ratio:16/9}
.sd{position:absolute;inset:0;display:grid;align-items:end;opacity:0;transition:opacity 1.1s ease;color:var(--tx);font:600 1.3rem Newsreader,serif}
.sd.on{opacity:1}
.sd img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sd span{position:relative;padding:18px}
.sd img+span{color:#fff;background:linear-gradient(transparent,rgba(20,40,80,.6))}
.g0{background:linear-gradient(135deg,#0a1f3d,#00C9FF)}.g1{background:linear-gradient(135deg,#0a1f3d,#92FE9D)}.g2{background:linear-gradient(135deg,#00C9FF,#92FE9D)}.g3{background:linear-gradient(135deg,#0a1f3d,#7FE9FF)}
.cr.sl{overflow:visible;border:0;box-shadow:none;border-radius:0;margin-bottom:10px}
.sl .vp{overflow:hidden;padding:6px 0 14px}
.sl .tr{display:flex;gap:12px;transform:translateX(calc(var(--i,0) * -1 * (78% + 12px)));transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.sl .sd{position:relative;flex:0 0 78%;aspect-ratio:4/3;border-radius:24px;overflow:hidden;opacity:.55;transform:scale(.9);transition:opacity .8s,transform .8s;box-shadow:var(--shadow)}
.sl .sd.on{opacity:1;transform:none}
.dots{position:absolute;bottom:12px;right:14px;display:flex;gap:6px}
.sl .dots{position:static;justify-content:center}
.dt{width:8px;height:8px;border-radius:8px;border:0;padding:0;background:rgba(255,255,255,.75);transition:width .35s,background .35s}
.sl .dt{background:rgba(255,255,255,.3)}
.dt.on{width:24px;background:#fff}.sl .dt.on{background:var(--pr)}
.cm{display:flex;gap:8px;margin:-8px 0 18px;flex-wrap:wrap}
label.btn{display:inline-block;margin:0;padding:7px 14px;font-size:.85rem;color:var(--pr)}.sm{padding:7px 14px;font-size:.85rem}
.sec{margin:26px 0 0;font-size:1.25rem}
.ct{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:0 0 18px}
.ct a{display:grid;place-items:center;width:76px;aspect-ratio:1;border:1px solid rgba(255,255,255,.35);border-radius:20px;color:#F4F9FF;background:linear-gradient(145deg,rgba(255,255,255,.24),rgba(0,193,255,.16) 52%,rgba(10,31,61,.7));-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:0 8px 22px rgba(3,12,30,.3),inset 0 1px 0 rgba(255,255,255,.35);text-decoration:none;transition:transform .25s,box-shadow .25s,border-color .25s}
.ct a.wa{background:linear-gradient(145deg,rgba(0,193,255,.3),rgba(0,193,163,.38),rgba(10,31,61,.72))}
.ct a.wa svg{width:54px;height:54px;stroke-width:2}
.ct a.ig{background:linear-gradient(145deg,rgba(0,193,255,.25),rgba(127,233,255,.24),rgba(10,31,61,.72))}
.ct a.mail{background:linear-gradient(145deg,rgba(146,254,157,.3),rgba(0,193,163,.25),rgba(10,31,61,.72))}
.ct a:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.65);box-shadow:0 12px 28px rgba(3,12,30,.4),inset 0 1px 0 rgba(255,255,255,.45)}
.ct a:active{transform:scale(.96)}
.ct svg{width:42px;height:42px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.ct .phone-icon{fill:currentColor;stroke:none}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.yr{font-size:1.2rem;margin:24px 0 10px;color:var(--pr)}
.li{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 18px;margin-bottom:8px;background:var(--sf);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--ln);border-radius:16px;color:var(--tx);box-shadow:var(--shadow)}
.li small{color:var(--mu);font-size:.88rem;text-align:right}
@media(max-width:600px){
 main{padding:16px 14px 100px}
 .hero{padding:20px 0 6px}
 .hero h1{font-size:clamp(2rem,9vw,2.4rem)}
 .bar{flex-wrap:wrap;align-items:center}
 .bar>div{min-width:0}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 .card{min-width:0;padding:7px;border-radius:17px}
 .card .nm{padding:9px 8px 10px;font-size:.9rem;overflow-wrap:anywhere}
 .card .nm small{overflow-wrap:anywhere}
 .stat{padding:15px 16px}
 .sheet{box-sizing:border-box;width:100%;max-height:90vh;max-height:90dvh;padding:18px 16px calc(22px + env(safe-area-inset-bottom,0px));border-radius:24px 24px 0 0}
 .top{gap:12px;align-items:flex-start}
 .top .ph{width:76px;font-size:1.7rem}
 .top h2{font-size:1.35rem;overflow-wrap:anywhere}
 .row{gap:8px}
 .row .btn{min-height:44px}
 .ct{gap:10px}
 .ct a{width:66px;border-radius:17px}
 .ct svg{width:38px;height:38px}
 .ct a.wa svg{width:48px;height:48px}
 .sl .sd{flex-basis:86%}
 .li{gap:8px;padding:12px 14px}
 .li small{text-align:right;overflow-wrap:anywhere}
 nav{gap:2px;padding:6px 6px env(safe-area-inset-bottom,0px)}
 nav button{font-size:.64rem;padding:8px 1px}
}
@media(max-width:360px){
 main{padding-right:12px;padding-left:12px}
 .grid{gap:8px}
 .card .nm{padding-right:6px;padding-left:6px;font-size:.86rem}
 nav button{font-size:.6rem}
 nav button svg{width:20px;height:20px}
}
</style>
</head>

];
var P=seed.slice(),page="home",user=null,photo=null,IX={a:0,b:0,m:0},TM=[];

function save(){try{localStorage.setItem("sd_people",JSON.stringify(P))}catch(e){}}
function saveC(){try{localStorage.setItem("sd_car",JSON.stringify(C))}catch(e){}}
function esc(t){return String(t==null?"":t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function ini(n){return n.replace(/^(Fr\.|Br\.)\s*/,"").split(/\s+/).slice(0,2).map(function(w){return w[0]}).join("").toUpperCase()}

var canEdit=function(p){return canAdd()||(user&&user.role==="seminarian"&&user.id===p.id)};
var ICON={
home:'<path d="M3 11l9-8 9 8M5 10v10h14V10"/>',
formators:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"/>',

var TABS=[["home","Home"],["formators","Formators"],["major","Major"],["minor","Minor"],["login",null]];
function go(p){page=p;render();window.scrollTo(0,0)}
function render(){
 document.getElementById("nav").innerHTML=TABS.map(function(t){
  var l=t[0]==="login"?(user?"Account":"Login"):t[1];

 startC();
}

 var b=[["formators","f"],["major","M"],["minor","m"]].map(function(x){

  ["Instagram",ig&&"https://instagram.com/"+ig,"ig",'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.8" cy="6.5" r=".7" fill="currentColor" stroke="none"/></svg>'],
  ["Email",p.email&&"mailto:"+p.email,"mail",'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="4.5" width="19" height="15" rx="2"/><path d="m3.5 6 8.5 7 8.5-7M4 18l6.3-6M20 18l-6.3-6"/></svg>']
 ].filter(function(x){return x[1]}).map(function(x){var target=x[0]==="WhatsApp"||x[0]==="Instagram"?' target="_blank" rel="noopener noreferrer"':"";return '<a class="'+x[2]+'" href="'+esc(x[1])+'" aria-label="'+x[0]+'" title="'+x[0]+'"'+target+'>'+x[3]+'<span class="sr-only">'+x[0]+'</span></a>'}).join("");
 ct=ct?'<div class="ct">'+ct+'</div>':"";
 var rows=[["Phone",p.phone],["Email",p.email],["Parish",p.parish],["Birthday",p.dob&&fd(p.dob)],["Feast",p.feast],["Seminary",p.seminary],["Address",p.address]].filter(function(r){return r[1]}).map(function(r){return '<div><dt>'+r[0]+'</dt><dd>'+esc(r[1])+'</dd></div>'}).join("");
 var act=(canEdit(p)?'<button class="btn" onclick="editP(\''+p.id+'\')">Edit details</button>':'')+(user&&user.role==="admin"?'<button class="btn del" onclick="delP(\''+p.id+'\')">Delete</button>':'');
 modal('<div class="top"><div class="ph">'+av(p)+'</div><div><h2>'+esc(p.name)+'</h2><div style="color:var(--mu)">'+esc(p.title)+'</div></div></div>'+ct+'<dl>'+rows+'</dl><div class="row">'+act+'<button class="btn alt" onclick="closeM()">Close</button></div>');
}
function fd(s){var d=new Date(s+"T00:00");return isNaN(d)?s:d.toLocaleDateString("en-IN",{day:"numeric",month:"long",year:"numeric"})}
function minorV(){
 var L=P.filter(function(p){return p.g==="m"}),ys=[];
 L.forEach(function(p){if(ys.indexOf(p.title)<0)ys.push(p.title)});
 ys.sort(function(a,b){return b.localeCompare(a,undefined,{numeric:true})});
 var add=canAdd()?'<button class="btn" onclick="editP(null,\'m\')">Add person</button>':'';
 return '<div class="bar"><h1>Minor Seminarians</h1>'+add+'</div>'+car("m","fx")+(ys.length?ys.map(function(y){return '<h2 class="yr">'+esc(y||"Year not set")+'</h2>'+L.filter(function(p){return p.title===y}).map(function(p){var t='<b>'+esc(p.name)+'</b><small>'+esc(p.parish)+'</small>';return canAdd()?'<button class="li" onclick="showP(\''+p.id+'\')">'+t+'</button>':'<div class="li">'+t+'</div>'}).join("")}).join(""):'<p class="empty">No one listed yet.</p>');
}
function car(k,st){
 var L=C[k];
 var m=canAdd()?'<div class="cm"><label class="btn alt sm">Add image<input type="file" accept="image/*" hidden onchange="addImg(\''+k+'\',this)"></label>'+(L.length?'<button class="btn del sm" onclick="rmImg(\''+k+'\')">Remove current</button>':'')+'</div>':'';
 if(!L.length)return canAdd()?'<p class="empty" style="padding:12px 0">No images yet.</p>'+m:'';
 if(IX[k]>=L.length)IX[k]=0;
 var sl=L.map(function(x,j){return '<div class="sd g'+(j%4)+(j===IX[k]?' on':'')+'">'+(x.img?'<img src="'+x.img+'" alt="">':'')+(x.t?'<span>'+esc(x.t)+'</span>':'')+'</div>'}).join("");
 var dots='<div class="dots">'+L.map(function(x,j){return '<button class="dt'+(j===IX[k]?' on':'')+'" aria-label="Image '+(j+1)+'" onclick="setC(\''+k+'\','+j+')"></button>'}).join("")+'</div>';
 return '<div class="cr '+st+'" id="c_'+k+'">'+(st==="sl"?'<div class="vp"><div class="tr" style="--i:'+IX[k]+'">'+sl+'</div></div>':sl)+dots+'</div>'+m;
}
function setC(k,i){
 var L=C[k];i=(i+L.length)%L.length;IX[k]=i;var e=document.getElementById("c_"+k);if(!e)return;
 e.querySelectorAll(".sd").forEach(function(s,j){s.classList.toggle("on",j===i)});
 e.querySelectorAll(".dt").forEach(function(d,j){d.classList.toggle("on",j===i)});
 var t=e.querySelector(".tr");if(t)t.style.setProperty("--i",i);
}
function startC(){TM.forEach(clearInterval);TM=[];["a","b","m"].forEach(function(k){if(document.getElementById("c_"+k)&&C[k].length>1)TM.push(setInterval(function(){setC(k,IX[k]+1)},k==="b"?4200:5600))})}
function shrink(f,mx,cb){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var c=document.createElement("canvas"),s=Math.min(1,mx/Math.max(im.width,im.height));c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",.8))};im.src=r.result};r.readAsDataURL(f)}
function addImg(k,i){var f=i.files[0];if(!f)return;shrink(f,1000,function(u){C[k].push({id:"i"+Date.now(),img:u});IX[k]=C[k].length-1;saveC();render()})}
function rmImg(k){C[k].splice(IX[k],1);IX[k]=0;saveC();render()}
function modal(h){var m=document.getElementById("modal");m.innerHTML='<div class="ov" onclick="if(event.target===this)closeM()"><div class="sheet" role="dialog" aria-modal="true">'+h+'</div></div>'}
function closeM(){document.getElementById("modal").innerHTML=""}
function editP(id,g){
 var p=id?P.find(function(x){return x.id===id}):{g:g,name:"",title:"",parish:"",phone:"",email:"",address:""};
 photo=p.photo||null;
 function f(k,l){return '<label for="e_'+k+'">'+l+'</label><input id="e_'+k+'" value="'+esc(p[k])+'">'}
 modal('<h2>'+(id?'Edit details':'Add person')+'</h2>'+f("name","Full name")+f("title",p.g==="f"?"Role":p.g==="M"?"Course and year":"Year / class")+f("phone","Phone")+f("whatsapp","WhatsApp number")+f("instagram","Instagram username")+f("email","Email")+
 '<label for="e_address">Address</label><textarea id="e_address" rows="2">'+esc(p.address)+'</textarea>'+f("parish","Parish")+(p.g!=="m"?f("dob","Birthday").replace("<input",'<input type="date"')+f("feast","Feast day"):"")+(p.g==="M"?f("seminary","Seminary"):"")+
 '<label for="e_photo">Photo</label><input id="e_photo" type="file" accept="image/*" onchange="pick(this)">'+
 '<div class="err" id="eerr"></div><div class="row"><button class="btn" onclick="saveP(\''+(id||"")+'\',\''+p.g+'\')">Save changes</button><button class="btn alt" onclick="closeM()">Cancel</button></div>');
}
function pick(i){
 var f=i.files[0];if(!f)return;var r=new FileReader();
 r.onload=function(){var im=new Image();im.onload=function(){var c=document.createElement("canvas"),s=Math.min(1,320/Math.max(im.width,im.height));c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);photo=c.toDataURL("image/jpeg",.8)};im.src=r.result};
 r.readAsDataURL(f);
}
function saveP(id,g){
 var v=function(k){return document.getElementById("e_"+k).value.trim()};
 if(!v("name")){document.getElementById("eerr").textContent="Enter a name to save.";return}
 var d={name:v("name"),title:v("title"),phone:v("phone"),email:v("email"),address:v("address"),parish:v("parish"),whatsapp:v("whatsapp"),instagram:v("instagram"),photo:photo};
 if(document.getElementById("e_dob"))d.dob=v("dob"),d.feast=v("feast");
 if(document.getElementById("e_seminary"))d.seminary=v("seminary");
 if(id){Object.assign(P.find(function(x){return x.id===id}),d)}
 else{d.id="p"+Date.now();d.g=g;P.push(d)}
 save();closeM();render();
}
function delP(id){
 var p=P.find(function(x){return x.id===id});
 modal('<h2>Delete '+esc(p.name)+'?</h2><p class="sub">This removes their card and details.</p><div class="row"><button class="btn del" onclick="P=P.filter(function(x){return x.id!==\''+id+'\'});save();closeM();render()">Delete</button><button class="btn alt" onclick="closeM()">Keep</button></div>');
}
function loginV(){
 
 
 return '<h1 style="margin-bottom:8px">Login</h1>'+
 '<form onsubmit="doLogin(event)"><label for="lu">Username or email</label><input id="lu" autocomplete="username"><label for="lp">Password</label><input id="lp" type="password" autocomplete="current-password"><div class="err" id="lerr"></div><div class="row"><button class="btn" type="submit">Log in</button></div></form>'+
 '<p class="note">Demo sign-ins: admin / admin123, staff / staff123, seminarians use their email (for example jacob@example.org) / 1234. Passwords are checked in the browser only, so connect a real backend before storing real records.</p>';
}
function doLogin(e){
 e.preventDefault();
 var u=document.getElementById("lu").value.trim().toLowerCase(),p=document.getElementById("lp").value;
 if(u==="admin"&&p==="admin123")user={role:"admin",name:"Administrator"};
 else if(u==="staff"&&p==="staff123")user={role:"staff",name:"Staff member"};
 else if(p==="1234"){var m=u&&P.find(function(x){return x.g!=="f"&&(x.email||"").toLowerCase()===u});if(m)user={role:"seminarian",name:m.name,id:m.id}}
 if(!user){document.getElementById("lerr").textContent="Username or password is incorrect. Check the demo details below and try again.";return}
 go("home");
}
function acctV(){
 var me=user.id?P.find(function(x){return x.id===user.id}):null;
 var info={admin:"You can add, edit and delete anyone in the directory.",staff:"You can add and edit people in the directory.",seminarian:"You can update your own details."}[user.role];
 return '<h1>'+esc(user.name)+'</h1><p class="sub">Signed in as '+user.role+'. '+info+'</p><div class="row" style="margin-top:0">'+(me?'<button class="btn" onclick="editP(\''+me.id+'\')">Edit my details</button>':'')+'<button class="btn alt" onclick="user=null;render()">Log out</button></div>';
}
render();
</script>
